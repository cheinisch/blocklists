name: Build Blocklists

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build blocklists
        run: |
          mkdir -p lists/pihole lists/adguard

          DATE="$(date '+%d. %B %Y')"

          PIHOLE_TMP="$(mktemp)"
          ADGUARD_TMP="$(mktemp)"

          find src -type f -name "*.txt" -print0 | while IFS= read -r -d '' file; do
            NAME="$(basename "$file" .txt)"

            TMP="$(mktemp)"

            sed -E '
              s/\r$//;
              s/#.*$//;
              s/^[[:space:]]+//;
              s/[[:space:]]+$//;
              /^$/d;
              s~^https?://~~;
              s~/.*$~~;
              s/^www\.//;
              s/^[[:space:]]*0\.0\.0\.0[[:space:]]+//;
              s/^[[:space:]]*127\.0\.0\.1[[:space:]]+//;
            ' "$file" | sort -u > "$TMP"

            COUNT="$(wc -l < "$TMP")"

            #
            # Pi-hole Liste
            #
            {
              echo "# Title: pi-hole - $NAME"
              echo "# Autor: Christian Heinisch"
              echo "# Date: $DATE"
              echo "# Number of unique domains: $COUNT"
              echo ""
              cat "$TMP"
            } > "lists/pihole/$NAME.txt"

            #
            # AdGuard Liste
            #
            {
              echo "# Title: AdGuard - $NAME"
              echo "# Autor: Christian Heinisch"
              echo "# Date: $DATE"
              echo "# Number of unique domains: $COUNT"
              echo ""
              sed 's/.*/||&^/' "$TMP"
            } > "lists/adguard/$NAME.txt"

            #
            # Für full.txt sammeln
            #
            cat "$TMP" >> "$PIHOLE_TMP"
            sed 's/.*/||&^/' "$TMP" >> "$ADGUARD_TMP"

            rm "$TMP"
          done

          #
          # FULL LISTS
          #
          sort -u "$PIHOLE_TMP" > pihole_full.txt
          sort -u "$ADGUARD_TMP" > adguard_full.txt

          PIHOLE_COUNT="$(wc -l < pihole_full.txt)"
          ADGUARD_COUNT="$(wc -l < adguard_full.txt)"

          {
            echo "# Title: pi-hole - Full"
            echo "# Autor: Christian Heinisch"
            echo "# Date: $DATE"
            echo "# Number of unique domains: $PIHOLE_COUNT"
            echo ""
            cat pihole_full.txt
          } > "lists/pihole/full.txt"

          {
            echo "# Title: AdGuard - Full"
            echo "# Autor: Christian Heinisch"
            echo "# Date: $DATE"
            echo "# Number of unique domains: $ADGUARD_COUNT"
            echo ""
            cat adguard_full.txt
          } > "lists/adguard/full.txt"

          rm "$PIHOLE_TMP"
          rm "$ADGUARD_TMP"
          rm pihole_full.txt
          rm adguard_full.txt

      - name: Commit generated lists
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update generated blocklists"
          file_pattern: lists/**/*.txt